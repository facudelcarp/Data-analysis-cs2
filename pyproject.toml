[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2analysis"
version = "0.1.0"
description = "Herramienta de data analysis para demos de Counter-Strike 2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "demoparser2>=0.40",
    "pandas>=2.1",
    "pyarrow>=14",
    "plotly>=5.20",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cs2a = "cs2analysis.cli:main"

[tool.setuptools.packages.find]
include = ["cs2analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
