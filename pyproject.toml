[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2analysis"
version = "0.1.0"
description = "Herramienta de data analysis para demos de Counter-Strike 2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "demoparser2>=0.40",
    "pandas>=2.1",
    "pyarrow>=14",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.6"]

[project.scripts]
cs2a = "cs2analysis.cli:main"

[project.gui-scripts]
cs2a-desktop = "cs2analysis.desktop.app:main"

[tool.setuptools.packages.find]
include = ["cs2analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Solo reglas que detectan errores reales (nombres sin definir, imports y variables sin usar);
# variables sin usar suelen ser lógica a medio terminar, como pasó en tactics/retakes.
select = ["F", "E9"]
