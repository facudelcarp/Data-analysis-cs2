name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest
      # Lógica con datos sintéticos + la app entera contra tests/fixtures/pro_sample.cs2a.
      # Los tests contra demos completas (tests/data/*.dem) se saltean solos si no están.
      - name: Tests
        run: pytest -q
