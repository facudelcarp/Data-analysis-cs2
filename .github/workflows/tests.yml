name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Qt sin pantalla (QT_QPA_PLATFORM=offscreen) igual necesita estas librerías del sistema
      - name: Librerías de sistema para Qt
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest ruff
      - name: Lint (ruff)
        run: ruff check .
      # Lógica con datos sintéticos + la app entera contra tests/fixtures/pro_sample.cs2a.
      # Los tests contra demos completas (tests/data/*.dem) se saltean solos si no están.
      - name: Tests
        run: pytest -q
